<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное - Digital Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4 flex-grow-1">
        <h1 class="mb-4">
            <i class="bi bi-heart-fill text-danger"></i> Избранное
        </h1>

        <div th:if="${products != null and !products.isEmpty()}">
            <div class="row g-4">
                <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products}">
                    <div class="card product-card h-100">
                        <div class="position-relative">
                            <img th:src="${product.imageUrl != null and !product.imageUrl.isEmpty() ? product.imageUrl : 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iIzYzNjZmMSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiNmZmZmZmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5Qcm9kdWN0PC90ZXh0Pjwvc3ZnPg=='}" 
                                 class="card-img-top" 
                                 style="height: 200px; object-fit: cover; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);"
                                 alt="Product image"
                                 onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iIzYzNjZmMSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiNmZmZmZmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5Qcm9kdWN0PC90ZXh0Pjwvc3ZnPg==';">
                            <button type="button" 
                                    class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2"
                                    th:data-product-id="${product.id}"
                                    th:onclick="'Favorites.toggle(' + ${product.id} + ', event)'"
                                    style="z-index: 10; background: rgba(255,255,255,0.9);">
                                <i class="bi bi-heart-fill"></i>
                            </button>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${product.name}"></h5>
                            <span class="badge bg-primary mb-2" th:text="${product.category.displayName}"></span>
                            <p class="card-text flex-grow-1 small" th:text="${#strings.abbreviate(product.description, 80)}"></p>
                            <div class="d-flex justify-content-between align-items-center mt-auto">
                                <h5 class="text-primary mb-0" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></h5>
                                <a th:href="@{/product/{id}(id=${product.id})}" class="btn btn-primary btn-sm">
                                    <i class="bi bi-eye"></i>
                                    <span class="d-none d-md-inline">Подробнее</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${products == null or products.isEmpty()}" class="text-center py-5">
            <i class="bi bi-heart" style="font-size: 4rem; color: #ccc;"></i>
            <h3 class="mt-3">Избранное пусто</h3>
            <p class="text-muted">Добавьте товары в избранное, чтобы вернуться к ним позже</p>
            <a href="/products" class="btn btn-primary">
                <i class="bi bi-arrow-left"></i> Перейти в каталог
            </a>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/favorites.js"></script>
    <script>
        // Mark all as favorites
        document.querySelectorAll('button[data-product-id]').forEach(btn => {
            const icon = btn.querySelector('i');
            icon.classList.remove('bi-heart');
            icon.classList.add('bi-heart-fill');
        });
    </script>
</body>
</html>
