<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина - Digital Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">
                    <i class="bi bi-cart3"></i> Корзина
                </h1>
                <p class="text-muted mb-0">Проверьте ваш заказ перед оформлением</p>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${cart != null and !cart.items.isEmpty()}">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th class="d-none d-md-table-cell">Товар</th>
                            <th class="d-table-cell d-md-none">Товар</th>
                            <th class="d-none d-md-table-cell">Цена</th>
                            <th>Кол-во</th>
                            <th>Сумма</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cart.items}">
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="flex-grow-1">
                                        <strong th:text="${item.product.name}"></strong>
                                        <br>
                                        <small class="text-muted d-block d-md-none" th:text="${item.product.category.displayName}"></small>
                                        <small class="text-muted d-none d-md-block" th:text="${item.product.category.displayName}"></small>
                                        <div class="d-md-none mt-1">
                                            <div th:if="${item.product.discountPercent == null or item.product.discountPercent == 0}">
                                                <small th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></small>
                                            </div>
                                            <div th:if="${item.product.discountPercent != null and item.product.discountPercent > 0}">
                                                <small class="text-primary fw-bold" th:text="${#numbers.formatDecimal(item.product.getFinalPrice(), 0, 'COMMA', 2, 'POINT') + ' ₽'}"></small>
                                                <br>
                                                <small class="text-muted text-decoration-line-through" th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></small>
                                                <span class="badge bg-danger ms-1" th:text="'-' + ${item.product.discountPercent} + '%'"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td class="d-none d-md-table-cell">
                                <div th:if="${item.product.discountPercent == null or item.product.discountPercent == 0}">
                                    <span th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></span>
                                </div>
                                <div th:if="${item.product.discountPercent != null and item.product.discountPercent > 0}">
                                    <div class="text-primary fw-bold" th:text="${#numbers.formatDecimal(item.product.getFinalPrice(), 0, 'COMMA', 2, 'POINT') + ' ₽'}"></div>
                                    <small class="text-muted text-decoration-line-through" th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></small>
                                    <span class="badge bg-danger ms-1" th:text="'-' + ${item.product.discountPercent} + '%'"></span>
                                </div>
                            </td>
                            <td>
                                <form th:action="@{/cart/update}" method="post" class="d-inline" 
                                      onsubmit="event.preventDefault(); return false;">
                                    <input type="hidden" name="cartItemId" th:value="${item.id}">
                                    <div class="input-group input-group-sm" style="max-width: 120px;">
                                        <button type="button" class="btn btn-outline-secondary" 
                                                th:onclick="'Cart.decreaseQuantity(' + ${item.id} + ', ' + ${item.product.stock} + ')'">
                                            <i class="bi bi-dash"></i>
                                        </button>
                                        <input type="number" name="quantity" class="form-control text-center" 
                                               th:id="'quantity-' + ${item.id}"
                                               th:value="${item.quantity}" 
                                               min="1" 
                                               th:max="${item.product.stock}"
                                               th:data-max="${item.product.stock}"
                                               onchange="Cart.updateQuantity([[${item.id}]], this.value);">
                                        <button type="button" class="btn btn-outline-secondary" 
                                                th:onclick="'Cart.increaseQuantity(' + ${item.id} + ', ' + ${item.product.stock} + ')'">
                                            <i class="bi bi-plus"></i>
                                        </button>
                                    </div>
                                </form>
                            </td>
                            <td class="item-total fw-bold" th:text="${#numbers.formatDecimal(item.product.getFinalPrice() * item.quantity, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></td>
                            <td>
                                <button type="button" class="btn btn-danger btn-sm" 
                                        th:onclick="'Cart.removeFromCart(' + ${item.id} + ')'"
                                        title="Удалить">
                                    <i class="bi bi-trash"></i>
                                    <span class="d-none d-md-inline ms-1">Удалить</span>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                    <tfoot class="table-light">
                        <tr>
                            <td colspan="2" class="text-end d-none d-md-table-cell"><strong>Итого:</strong></td>
                            <td colspan="3" class="text-end d-table-cell d-md-none"><strong>Итого:</strong></td>
                            <td><strong class="text-primary fs-5" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></strong></td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                <a th:href="@{/products}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Продолжить покупки
                </a>
                <a th:href="@{/order/create}" class="btn btn-primary btn-lg">
                    <i class="bi bi-bag-check"></i> Оформить заказ
                </a>
            </div>
        </div>

        <div th:if="${cart == null or cart.items.isEmpty()}" class="text-center py-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body py-5">
                    <i class="bi bi-cart-x" style="font-size: 4rem; color: #ccc;"></i>
                    <h3 class="mt-3">Корзина пуста</h3>
                    <p class="text-muted mb-4">Добавьте товары в корзину для оформления заказа</p>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="/products" class="btn btn-primary">
                            <i class="bi bi-arrow-left"></i> Перейти в каталог
                        </a>
                        <a href="/" class="btn btn-outline-primary">
                            <i class="bi bi-house"></i> На главную
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/carousel.js"></script>
    <script>
        // Override removeFromCart to work with button
        const originalRemove = Cart.removeFromCart;
        Cart.removeFromCart = function(cartItemId) {
            if (!confirm('Удалить товар из корзины?')) return;
            
            const row = document.querySelector(`button[onclick*="${cartItemId}"]`)?.closest('tr');
            if (!row) return;
            
            const formData = new FormData();
            formData.append('cartItemId', cartItemId);
            
            fetch('/cart/remove', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            }).then(response => {
                if (response.ok) {
                    return response.json();
                }
                throw new Error('Ошибка сервера');
            }).then(data => {
                if (data.success) {
                    row.style.animation = 'fadeOut 0.3s ease';
                    setTimeout(() => {
                        row.remove();
                        Cart.updateCartBadge();
                        Utils.showNotification('Товар удален из корзины', 'success');
                        if (document.querySelectorAll('tbody tr').length === 0) {
                            setTimeout(() => location.reload(), 500);
                        }
                    }, 300);
                } else {
                    Utils.showNotification(data.message || 'Ошибка при удалении товара', 'danger');
                }
            }).catch(error => {
                Utils.showNotification('Ошибка при удалении товара', 'danger');
            });
        };
        
        // Add tooltips
        document.addEventListener('DOMContentLoaded', function() {
            Tooltips.init();
        });
    </script>
</body>
</html>
