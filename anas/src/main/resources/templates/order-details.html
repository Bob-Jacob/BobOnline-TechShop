<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали заказа - Digital Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4 flex-grow-1">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Главная</a></li>
                <li class="breadcrumb-item"><a href="/orders">Мои заказы</a></li>
                <li class="breadcrumb-item active">Заказ #<span th:text="${order.id}"></span></li>
            </ol>
        </nav>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">Заказ #<span th:text="${order.id}"></span></h1>
                <p class="text-muted mb-0">Детальная информация о вашем заказе</p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Состав заказа</h5>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Товар</th>
                                    <th>Количество</th>
                                    <th>Цена</th>
                                    <th>Сумма</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${order.items}">
                                    <td th:text="${item.product.name}"></td>
                                    <td th:text="${item.quantity}"></td>
                                    <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></td>
                                    <td th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="3" class="text-end"><strong>Итого:</strong></td>
                                    <td><strong th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></strong></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Информация о заказе</h5>
                    </div>
                    <div class="card-body">
                        <p><strong>Статус:</strong> 
                            <span class="badge" 
                                  th:class="${order.status.name() == 'COMPLETED'} ? 'bg-success' : 
                                           (${order.status.name() == 'PAID'} ? 'bg-info' : 
                                           (${order.status.name() == 'PENDING'} ? 'bg-warning' : 'bg-danger'))"
                                  th:text="${order.status.displayName}">
                            </span>
                        </p>
                        <p><strong>Дата создания:</strong> 
                            <span th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
                        </p>
                        <p><strong>Сумма:</strong> 
                            <span th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></span>
                        </p>
                        <div th:if="${order.status.name() == 'PENDING'}">
                            <a th:href="@{/order/{id}/payment(id=${order.id})}" class="btn btn-primary w-100">
                                <i class="bi bi-credit-card"></i> Оплатить
                            </a>
                        </div>
                        <a href="/orders" class="btn btn-outline-secondary w-100 mt-2">
                            <i class="bi bi-arrow-left"></i> Вернуться к заказам
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/carousel.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            Tooltips.init();
        });
    </script>
</body>
</html>
