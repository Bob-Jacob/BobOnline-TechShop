<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Digital Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); background-attachment: fixed;">
    <div class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="row w-100 justify-content-center">
            <div class="col-lg-5 col-md-6 col-sm-8">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="card-title text-center mb-4">
                            <i class="bi bi-box-arrow-in-right"></i> Вход
                        </h2>
                        <div th:if="${param.error}" class="alert alert-danger">
                            Неверный email или пароль
                        </div>
                        <div th:if="${successMessage}" class="alert alert-success">
                            <span th:text="${successMessage}"></span>
                        </div>
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email
                                    <i class="bi bi-question-circle text-muted ms-1" 
                                       data-bs-toggle="tooltip" 
                                       title="Введите email, который вы использовали при регистрации"></i>
                                </label>
                                <input type="email" class="form-control" id="email" name="username" required
                                       placeholder="example@email.com">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Пароль
                                    <i class="bi bi-question-circle text-muted ms-1" 
                                       data-bs-toggle="tooltip" 
                                       title="Введите ваш пароль"></i>
                                </label>
                                <input type="password" class="form-control" id="password" name="password" required
                                       placeholder="Введите пароль">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">Войти</button>
                        </form>
                        <div class="text-center">
                            <p>Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/carousel.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            Tooltips.init();
        });
    </script>
</body>
</html>
