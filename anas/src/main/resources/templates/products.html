<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров - Digital Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">Каталог товаров</h1>
                <p class="text-muted mb-0">Найдите то, что вам нужно</p>
            </div>
            <div class="d-none d-md-block">
                <span class="badge bg-primary" 
                      data-bs-toggle="tooltip" 
                      title="Все товары проверены и готовы к использованию">
                    <i class="bi bi-shield-check"></i> Проверено
                </span>
            </div>
        </div>

        <!-- Search and Filter Section -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="search-input" class="form-label">
                            <i class="bi bi-search"></i> Поиск товаров
                        </label>
                        <form th:action="@{/products}" method="get" class="search-box">
                            <div class="input-group">
                                <input type="text" name="search" class="form-control" 
                                       th:value="${searchQuery}" 
                                       placeholder="Введите название товара..." 
                                       id="search-input"
                                       data-bs-toggle="tooltip"
                                       title="Начните вводить название товара для поиска">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-search"></i> Найти
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="bi bi-funnel"></i> Категории
                        </label>
                        <div class="btn-group flex-wrap" role="group">
                            <a th:href="@{/products}" class="btn btn-outline-primary btn-sm" 
                               th:classappend="${selectedCategory == null} ? 'active'">
                                Все
                            </a>
                            <a th:each="category : ${categories}" 
                               th:href="@{/products(category=${category.name})}"
                               class="btn btn-outline-primary btn-sm"
                               th:classappend="${selectedCategory == category.name} ? 'active'"
                               th:text="${category.displayName}">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="card shadow-sm mb-4">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi bi-sliders"></i> Фильтры и сортировка
                </h5>
            </div>
            <div class="card-body">
                <form th:action="@{/products}" method="get" id="filtersForm">
                    <!-- Сохраняем текущие параметры поиска и категории -->
                    <input type="hidden" name="search" th:value="${searchQuery}">
                    <input type="hidden" name="category" th:value="${selectedCategory}">
                    
                    <div class="row g-3">
                        <!-- Диапазон цен -->
                        <div class="col-md-3">
                            <label class="form-label">Цена от</label>
                            <input type="number" name="minPrice" class="form-control" 
                                   th:value="${minPrice}" 
                                   placeholder="0" 
                                   min="0" 
                                   step="0.01">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Цена до</label>
                            <input type="number" name="maxPrice" class="form-control" 
                                   th:value="${maxPrice}" 
                                   placeholder="100000" 
                                   min="0" 
                                   step="0.01">
                        </div>
                        
                        <!-- Только в наличии -->
                        <div class="col-md-3">
                            <label class="form-label">Наличие</label>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" name="inStock" 
                                       id="inStock" 
                                       th:checked="${inStock}">
                                <label class="form-check-label" for="inStock">
                                    Только в наличии
                                </label>
                            </div>
                        </div>
                        
                        <!-- Сортировка -->
                        <div class="col-md-3">
                            <label class="form-label">Сортировка</label>
                            <select name="sortBy" class="form-select">
                                <option value="">По умолчанию</option>
                                <option th:each="option : ${sortOptions}" 
                                        th:value="${option.name()}" 
                                        th:text="${option.displayName}"
                                        th:selected="${sortBy == option.name()}">
                                </option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row mt-3">
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-funnel"></i> Применить фильтры
                            </button>
                            <a th:href="@{/products}" class="btn btn-outline-secondary ms-2">
                                <i class="bi bi-x-circle"></i> Сбросить
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Results Info -->
        <div class="alert alert-info d-flex align-items-center mb-4" 
             th:if="${products != null and !products.isEmpty()}">
            <i class="bi bi-info-circle me-2"></i>
            <span>Найдено товаров: <strong th:text="${products.size()}"></strong></span>
        </div>

        <div class="row g-4" th:if="${products != null and !products.isEmpty()}">
            <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products}">
                <div class="card product-card h-100">
                    <div class="position-relative">
                        <img th:src="${product.imageUrl != null and !product.imageUrl.isEmpty() ? product.imageUrl : 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iIzYzNjZmMSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiNmZmZmZmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5Qcm9kdWN0PC90ZXh0Pjwvc3ZnPg=='}" 
                             onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iIzYzNjZmMSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiNmZmZmZmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5Qcm9kdWN0PC90ZXh0Pjwvc3ZnPg==';" 
                             class="card-img-top" 
                             style="height: 200px; object-fit: cover; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);"
                             alt="Product image">
                        <button sec:authorize="isAuthenticated()" 
                                type="button" 
                                class="btn btn-sm btn-outline-danger position-absolute top-0 end-0 m-2"
                                th:data-product-id="${product.id}"
                                th:onclick="'Favorites.toggle(' + ${product.id} + ', event)'"
                                style="z-index: 10; background: rgba(255,255,255,0.9);">
                            <i class="bi bi-heart"></i>
                        </button>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${product.name}"></h5>
                        <span class="badge bg-primary mb-2" th:text="${product.category.displayName}"></span>
                        
                        <!-- Рейтинг -->
                        <div class="mb-2" th:if="${product.averageRating != null}">
                            <div class="d-flex align-items-center gap-1">
                                <div class="d-flex">
                                    <span th:each="i : ${#numbers.sequence(1, 5)}">
                                        <i class="bi" 
                                           th:class="${i <= product.averageRating.intValue()} ? 'bi-star-fill text-warning' : 'bi-star'"
                                           style="font-size: 0.75rem;"></i>
                                    </span>
                                </div>
                                <small class="text-muted" th:text="${product.reviewsCount} + ' отзывов'"></small>
                            </div>
                        </div>
                        
                        <p class="card-text flex-grow-1 small" th:text="${#strings.abbreviate(product.description, 80)}"></p>
                        <div class="d-flex justify-content-between align-items-center mt-auto gap-2">
                            <div>
                                <h5 class="text-primary mb-0" th:if="${product.discountPercent == null or product.discountPercent == 0}"
                                    th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></h5>
                                <div th:if="${product.discountPercent != null and product.discountPercent > 0}">
                                    <h5 class="text-primary mb-0" th:text="${#numbers.formatDecimal(product.getFinalPrice(), 0, 'COMMA', 2, 'POINT') + ' ₽'}"></h5>
                                    <small class="text-muted text-decoration-line-through" 
                                           th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></small>
                                    <span class="badge bg-danger ms-1" th:text="'-' + ${product.discountPercent} + '%'"></span>
                                </div>
                            </div>
                            <a th:href="@{/product/{id}(id=${product.id})}" 
                               class="btn btn-primary btn-sm flex-shrink-0"
                               title="Посмотреть детали товара">
                                <i class="bi bi-eye"></i>
                                <span class="d-none d-sm-inline">Подробнее</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" th:if="${products == null or products.isEmpty()}">
            <div class="col-12">
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i> Товары не найдены
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/favorites.js"></script>
    <script src="/js/carousel.js"></script>
    <script src="/js/filters.js"></script>
    <script>
        // Check favorite status for all products
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('button[data-product-id]').forEach(btn => {
                const productId = btn.getAttribute('data-product-id');
                if (productId) {
                    Favorites.checkStatus(productId);
                }
            });
            // Initialize tooltips
            Tooltips.init();
        });
    </script>
</body>
</html>
