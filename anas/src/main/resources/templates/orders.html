<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заказы - Digital Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">
                    <i class="bi bi-bag-check"></i> Мои заказы
                </h1>
                <p class="text-muted mb-0">История всех ваших покупок</p>
            </div>
        </div>

        <div th:if="${orders != null and !orders.isEmpty()}">
            <div class="row g-3">
                <div class="col-12 col-md-6 col-lg-4" th:each="order : ${orders}">
                    <div class="card h-100 shadow-sm">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h6 class="mb-0">Заказ #<span th:text="${order.id}"></span></h6>
                            <span class="badge" 
                                  th:class="${order.status.name() == 'COMPLETED'} ? 'bg-success' : 
                                           (${order.status.name() == 'PAID'} ? 'bg-info' : 
                                           (${order.status.name() == 'PENDING'} ? 'bg-warning' : 'bg-danger'))"
                                  th:text="${order.status.displayName}">
                            </span>
                        </div>
                        <div class="card-body">
                            <p class="mb-2">
                                <strong>Сумма:</strong> 
                                <span class="text-primary fs-5" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></span>
                            </p>
                            <p class="mb-2 text-muted small">
                                <i class="bi bi-calendar"></i> 
                                <span th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
                            </p>
                            <p class="mb-0 small text-muted">
                                Товаров: <span th:text="${order.items.size()}"></span>
                            </p>
                        </div>
                        <div class="card-footer bg-transparent">
                            <a th:href="@{/order/{id}(id=${order.id})}" class="btn btn-primary btn-sm w-100">
                                <i class="bi bi-eye"></i> Подробнее
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${orders == null or orders.isEmpty()}" class="text-center py-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body py-5">
                    <i class="bi bi-inbox" style="font-size: 4rem; color: #ccc;"></i>
                    <h3 class="mt-3">У вас пока нет заказов</h3>
                    <p class="text-muted mb-4">Начните покупки в нашем каталоге</p>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="/products" class="btn btn-primary">
                            <i class="bi bi-arrow-left"></i> Перейти в каталог
                        </a>
                        <a href="/" class="btn btn-outline-primary">
                            <i class="bi bi-house"></i> На главную
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/carousel.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            Tooltips.init();
        });
    </script>
</body>
</html>
