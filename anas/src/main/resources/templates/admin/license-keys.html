<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление лицензионными ключами - Digital Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: admin-navbar}"></div>

    <main class="container my-4 flex-grow-1">
        <h1 class="mb-4">Управление лицензионными ключами</h1>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Выберите товар</h5>
                    </div>
                    <div class="card-body">
                        <form method="get" action="/admin/license-keys">
                            <select name="productId" class="form-select" onchange="this.form.submit()">
                                <option value="">-- Выберите товар --</option>
                                <option th:each="p : ${products}" 
                                        th:value="${p.id}" 
                                        th:selected="${product != null and product.id == p.id}"
                                        th:text="${p.name}">
                                </option>
                            </select>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${product != null}">
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Товар: <span th:text="${product.name}"></span></h5>
                </div>
                <div class="card-body">
                    <h6>Добавить ключ</h6>
                    <form th:action="@{/admin/license-keys/add}" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <div class="input-group mb-3">
                            <input type="text" name="key" class="form-control" placeholder="Лицензионный ключ" required>
                            <button type="submit" class="btn btn-primary">Добавить</button>
                        </div>
                    </form>

                    <h6 class="mt-4">Массовая загрузка из файла</h6>
                    <form th:action="@{/admin/license-keys/upload}" method="post" enctype="multipart/form-data">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <div class="input-group mb-3">
                            <input type="file" name="file" class="form-control" accept=".txt" required>
                            <button type="submit" class="btn btn-success">Загрузить</button>
                        </div>
                        <small class="text-muted">Файл должен содержать один ключ на строку</small>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h5>Список ключей</h5>
                </div>
                <div class="card-body">
                    <div th:if="${licenseKeys != null and !licenseKeys.isEmpty()}">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Ключ</th>
                                    <th>Использован</th>
                                    <th>Дата создания</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="key : ${licenseKeys}">
                                    <td th:text="${key.id}"></td>
                                    <td><code th:text="${key.key}"></code></td>
                                    <td>
                                        <span class="badge" 
                                              th:class="${key.isUsed} ? 'bg-danger' : 'bg-success'"
                                              th:text="${key.isUsed} ? 'Да' : 'Нет'">
                                        </span>
                                    </td>
                                    <td th:text="${#temporals.format(key.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                                    <td>
                                        <form th:action="@{/admin/license-keys/{keyId}/delete(keyId=${key.id}, productId=${product.id})}" 
                                              method="post" 
                                              class="d-inline"
                                              th:onsubmit="return confirm('Вы уверены, что хотите удалить этот ключ?');">
                                            <button type="submit" class="btn btn-sm btn-danger">
                                                <i class="bi bi-trash"></i> Удалить
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:if="${licenseKeys == null or licenseKeys.isEmpty()}">
                        <p class="text-muted">Ключи не добавлены</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
