<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление промокодами - Digital Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: admin-navbar}"></div>

    <main class="container my-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Управление промокодами</h1>
            <a href="/admin/promo-codes/new" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Создать промокод
            </a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${promoCodes != null and !promoCodes.isEmpty()}">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Код</th>
                                    <th>Тип скидки</th>
                                    <th>Значение</th>
                                    <th>Действителен</th>
                                    <th>Использований</th>
                                    <th>Статус</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="promo : ${promoCodes}">
                                    <td><strong th:text="${promo.code}"></strong></td>
                                    <td>
                                        <span th:if="${promo.discountPercent != null}" class="badge bg-info">Процент</span>
                                        <span th:if="${promo.discountAmount != null}" class="badge bg-warning">Фиксированная</span>
                                    </td>
                                    <td>
                                        <span th:if="${promo.discountPercent != null}" 
                                              th:text="${promo.discountPercent} + '%'"></span>
                                        <span th:if="${promo.discountAmount != null}" 
                                              th:text="${#numbers.formatDecimal(promo.discountAmount, 0, 'COMMA', 2, 'POINT') + ' ₽'}"></span>
                                    </td>
                                    <td>
                                        <div th:if="${promo.validFrom != null or promo.validTo != null}">
                                            <small th:if="${promo.validFrom != null}" 
                                                   th:text="${#temporals.format(promo.validFrom, 'dd.MM.yyyy')}"></small>
                                            <span th:if="${promo.validFrom != null and promo.validTo != null}"> - </span>
                                            <small th:if="${promo.validTo != null}" 
                                                   th:text="${#temporals.format(promo.validTo, 'dd.MM.yyyy')}"></small>
                                        </div>
                                        <small th:if="${promo.validFrom == null and promo.validTo == null}" 
                                               class="text-muted">Без ограничений</small>
                                    </td>
                                    <td>
                                        <span th:text="${promo.currentUses}"></span>
                                        <span th:if="${promo.maxUses != null}" 
                                              th:text="' / ' + ${promo.maxUses}"></span>
                                    </td>
                                    <td>
                                        <span class="badge" 
                                              th:class="${promo.isActive} ? 'bg-success' : 'bg-secondary'"
                                              th:text="${promo.isActive} ? 'Активен' : 'Неактивен'">
                                        </span>
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <form th:action="@{/admin/promo-codes/{id}/toggle(id=${promo.id})}" 
                                                  method="post" 
                                                  class="d-inline">
                                                <button type="submit" class="btn btn-sm" 
                                                        th:class="${promo.isActive} ? 'btn-warning' : 'btn-success'"
                                                        th:text="${promo.isActive} ? 'Деактивировать' : 'Активировать'">
                                                </button>
                                            </form>
                                            <form th:action="@{/admin/promo-codes/{id}/delete(id=${promo.id})}" 
                                                  method="post" 
                                                  class="d-inline"
                                                  th:onsubmit="return confirm('Удалить промокод?');">
                                                <button type="submit" class="btn btn-danger btn-sm">
                                                    <i class="bi bi-trash"></i> Удалить
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div th:if="${promoCodes == null or promoCodes.isEmpty()}">
                    <p class="text-muted text-center py-4">Промокоды не найдены</p>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
