<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать промокод - Digital Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: admin-navbar}"></div>

    <main class="container my-4 flex-grow-1">
        <h1 class="mb-4">Создать промокод</h1>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/admin/promo-codes/save}" th:object="${promoCode}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Код промокода *</label>
                            <input type="text" class="form-control" th:field="*{code}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Статус</label>
                            <select class="form-select" th:field="*{isActive}">
                                <option th:value="true">Активен</option>
                                <option th:value="false">Неактивен</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Скидка в процентах</label>
                            <input type="number" class="form-control" th:field="*{discountPercent}" 
                                   min="0" max="100" step="1">
                            <small class="text-muted">Оставьте пустым, если используете фиксированную сумму</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Фиксированная скидка (₽)</label>
                            <input type="number" class="form-control" th:field="*{discountAmount}" 
                                   min="0" step="0.01">
                            <small class="text-muted">Оставьте пустым, если используете процент</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Минимальная сумма заказа (₽)</label>
                            <input type="number" class="form-control" th:field="*{minOrderAmount}" 
                                   min="0" step="0.01">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Максимальное количество использований</label>
                            <input type="number" class="form-control" th:field="*{maxUses}" 
                                   min="1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Действителен с</label>
                            <input type="datetime-local" class="form-control" th:field="*{validFrom}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Действителен до</label>
                            <input type="datetime-local" class="form-control" th:field="*{validTo}">
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Сохранить
                        </button>
                        <a href="/admin/promo-codes" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
