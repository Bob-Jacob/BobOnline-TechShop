<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление отзывами - Digital Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: admin-navbar}"></div>

    <main class="container my-4 flex-grow-1">
        <h1 class="mb-4">Управление отзывами</h1>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <form method="get" action="/admin/reviews" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Товар</label>
                        <select name="productId" class="form-select">
                            <option value="">Все товары</option>
                            <option th:each="p : ${products}" 
                                    th:value="${p.id}" 
                                    th:selected="${selectedProductId == p.id}"
                                    th:text="${p.name}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Статус</label>
                        <select name="approved" class="form-select">
                            <option value="">Все</option>
                            <option value="true" th:selected="${selectedApproved == true}">Одобренные</option>
                            <option value="false" th:selected="${selectedApproved == false}">На модерации</option>
                        </select>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-funnel"></i> Фильтровать
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Список отзывов</h5>
            </div>
            <div class="card-body">
                <div th:if="${reviews != null and !reviews.isEmpty()}">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Товар</th>
                                    <th>Пользователь</th>
                                    <th>Рейтинг</th>
                                    <th>Комментарий</th>
                                    <th>Статус</th>
                                    <th>Дата</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="review : ${reviews}">
                                    <td th:text="${review.id}"></td>
                                    <td>
                                        <a th:href="@{/product/{id}(id=${review.product.id})}" 
                                           th:text="${review.product.name}"></a>
                                    </td>
                                    <td th:text="${review.user.email}"></td>
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <span th:text="${review.rating}"></span>
                                            <i class="bi bi-star-fill text-warning ms-1"></i>
                                        </div>
                                    </td>
                                    <td>
                                        <span th:text="${#strings.abbreviate(review.comment ?: 'Без комментария', 50)}"></span>
                                    </td>
                                    <td>
                                        <span class="badge" 
                                              th:class="${review.isApproved} ? 'bg-success' : 'bg-warning'"
                                              th:text="${review.isApproved} ? 'Одобрен' : 'На модерации'">
                                        </span>
                                    </td>
                                    <td th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <form th:if="${!review.isApproved}" 
                                                  th:action="@{/admin/reviews/{id}/approve(id=${review.id})}" 
                                                  method="post" 
                                                  class="d-inline">
                                                <button type="submit" class="btn btn-success btn-sm">
                                                    <i class="bi bi-check-circle"></i> Одобрить
                                                </button>
                                            </form>
                                            <form th:action="@{/admin/reviews/{id}/delete(id=${review.id})}" 
                                                  method="post" 
                                                  class="d-inline"
                                                  th:onsubmit="return confirm('Удалить отзыв?');">
                                                <button type="submit" class="btn btn-danger btn-sm">
                                                    <i class="bi bi-trash"></i> Удалить
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div th:if="${reviews == null or reviews.isEmpty()}">
                    <p class="text-muted text-center py-4">Отзывы не найдены</p>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
